# Logitech F310 (XInput mode) as keyboard for the ptb tasks:
#   D-pad and left stick -> arrow keys, A/B/X/Y -> Space (any face button answers / continues). F10 stays on the keyboard.
# Needs: sudo apt install xserver-xorg-input-joystick
# Install: sudo cp 53-gamepad-arrows.conf /etc/X11/xorg.conf.d/   then restart the X server.
# X keycodes: Up 111, Down 116, Left 113, Right 114, Space 65.
Section "InputClass"
	Identifier "ptb gamepad as arrow keys"
	MatchIsJoystick "on"
	MatchDevicePath "/dev/input/event*"
	Driver "joystick"
	Option "StartKeysEnabled"  "True"
	Option "StartMouseEnabled" "False"
	# buttons 1-4 = A, B, X, Y -> Space; the others do nothing
	Option "MapButton1"  "key=65"
	Option "MapButton2"  "key=65"
	Option "MapButton3"  "key=65"
	Option "MapButton4"  "key=65"
	Option "MapButton5"  "none"
	Option "MapButton6"  "none"
	Option "MapButton7"  "none"
	Option "MapButton8"  "none"
	Option "MapButton9"  "none"
	Option "MapButton10" "none"
	Option "MapButton11" "none"
	# axes: 1/2 left stick, 3 LT, 4/5 right stick, 6 RT, 7/8 D-pad
	Option "MapAxis1" "mode=relative keylow=113 keyhigh=114 deadzone=16000"
	Option "MapAxis2" "mode=relative keylow=111 keyhigh=116 deadzone=16000"
	Option "MapAxis3" "mode=none"
	Option "MapAxis4" "mode=none"
	Option "MapAxis5" "mode=none"
	Option "MapAxis6" "mode=none"
	Option "MapAxis7" "mode=relative keylow=113 keyhigh=114"
	Option "MapAxis8" "mode=relative keylow=111 keyhigh=116"
EndSection
