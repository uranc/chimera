# Gamepad as a raw input device for Psychtoolbox (Linux / X11).
# Psychtoolbox reads the pad itself (functions/gamepad_keys.m maps it to keys
# for every task); X must only expose its buttons and axes, not move the
# mouse or type keys.
# Needs: sudo apt install xserver-xorg-input-joystick
# Install: sudo cp 53-gamepad-arrows.conf /etc/X11/xorg.conf.d/   then restart X.
Section "InputClass"
	Identifier "ptb gamepad raw"
	MatchIsJoystick "on"
	MatchDevicePath "/dev/input/event*"
	Driver "joystick"
	Option "Floating" "on"
	Option "StartKeysEnabled"  "False"
	Option "StartMouseEnabled" "False"
	# buttons 1..11 as buttons 1..11
	Option "MapButton1"  "button=1"
	Option "MapButton2"  "button=2"
	Option "MapButton3"  "button=3"
	Option "MapButton4"  "button=4"
	Option "MapButton5"  "button=5"
	Option "MapButton6"  "button=6"
	Option "MapButton7"  "button=7"
	Option "MapButton8"  "button=8"
	Option "MapButton9"  "button=9"
	Option "MapButton10" "button=10"
	Option "MapButton11" "button=11"
	# axes 1..8 as raw valuators 3..10 (1/2 left stick, 3 LT, 4/5 right stick,
	# 6 RT, 7/8 D-pad); no pointer motion
	Option "MapAxis1" "mode=none valuator"
	Option "MapAxis2" "mode=none valuator"
	Option "MapAxis3" "mode=none valuator"
	Option "MapAxis4" "mode=none valuator"
	Option "MapAxis5" "mode=none valuator"
	Option "MapAxis6" "mode=none valuator"
	Option "MapAxis7" "mode=none valuator"
	Option "MapAxis8" "mode=none valuator"
EndSection
